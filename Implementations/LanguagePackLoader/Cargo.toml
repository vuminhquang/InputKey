[package]
name = "inputkey-language-pack-loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inputkey-language-pack-native-abi = { path = "../LanguagePackNativeABI" }
inputkey-core-abstractions = { path = "../../CoreAbstractions" }
libloading = "0.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
