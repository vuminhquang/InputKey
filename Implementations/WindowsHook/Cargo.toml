[package]
name = "inputkey-windows-hook"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inputkey-core-abstractions = { path = "../../CoreAbstractions" }
inputkey-windows-clipboard = { path = "../WindowsClipboard" }
inputkey-windows-settings = { path = "../WindowsSettings" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Security", "Win32_System_Registry"] }
